<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video İzleme</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      background: #fff;
      max-width: 580px;
      margin: 50px auto 20px auto;
      padding: 32px 28px 16px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 22px;
      margin-top: 0;
    }
    video {
      width: 100%;
      max-width: 480px;
      height: 270px;
      margin-bottom: 25px;
      border-radius: 10px;
      background: #e0e1e2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .footer-btn {
      width: 100%;
      text-align: center;
      margin: 28px 0 8px 0;
    }
    .btn {
      background-color: #2c3e50;
      color: white;
      padding: 10px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      font-size: 15px;
      transition: background-color 0.3s;
      cursor: pointer;
      margin: 0 auto;
      display: inline-block;
    }
    .btn:hover {
      background-color: #18bc9c;
    }
    @media (max-width: 700px) {
      .container {
        max-width: 98vw;
        padding: 10px 4vw;
      }
      video {
        width: 100%;
        max-width: 99vw;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎬 Video İzleme</h2>
    <video controls>
      <source src="avatarlar/sitetanıtım.mp4" type="video/mp4">
      Tarayıcınız video etiketini desteklemiyor.
    </video>
    <!-- Başka içerik de eklenebilir -->
  </div>
  <div class="footer-btn">
    <a href="anasayfa.html" class="btn">Anasayfaya Dön</a>
  </div>
</body>
</html>
