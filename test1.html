<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Osmanlı'nın Kuruluşu Sınavı</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background-color: #f9f9f9;
color: #333;
}
.container {
max-width: 800px;
margin: auto;
background: #fff;
padding: 20px;
box-shadow: 0 0 10px rgba(0,0,0,0.1);
border-radius: 8px;
}
h1 {
text-align: center;
}
.question {
display: none;
margin-top: 20px;
}
.question.active {
display: block;
}
.navigation {
text-align: center;
margin: 20px 0;
}
.navigation button {
margin: 2px;
padding: 8px 12px;
border: none;
background: #007BFF;
color: white;
border-radius: 4px;
cursor: pointer;
}
.navigation button.answered {
background: #28a745;
}
.navigation button:hover {
background: #0056b3;
}
.timer {
text-align: right;
font-weight: bold;
}
#result {
display: none;
font-weight: bold;
font-size: 18px;
margin-top: 20px;
text-align: center;
}
#previewAnswers {
margin-top: 10px;
display: none;
}
.skip-btn {
margin-top: 10px;
display: inline-block;
background: #ffc107;
color: #000;
padding: 6px 10px;
border: none;
border-radius: 4px;
cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
<div class="timer" id="timer">20:00</div>
<h1>Osmanlı'nın Kuruluşu Sınavı</h1>

<div id="questions"></div>

<div class="navigation" id="navigation"></div>
<div style="text-align:center">
<button id="submitBtn" onclick="calculateResult()">Sınavı Bitir</button>
<button onclick="previewAnswers()">Önizleme</button>
</div>
<div id="result"></div>
<div id="previewAnswers"></div>
</div>

<script>
let questionData = [];
let currentQuestion = 1;
let totalQuestions = 20;
let timer = 1200;

fetch("sorular.json")
.then(response => response.json())
.then(data => {
questionData = data;
generateQuestions();
createNavigation();
updateTimer();
showQuestion(1);
});

function generateQuestions() {
let questionsHTML = "";
questionData.forEach((q, i) => {
let html = `<div class='question' id='q${i+1}'>`;
html += `<p><b>${i+1}.</b> ${q.question}</p>`;
if(q.type === 'boşluk') {
html += `<input type='text' data-answer='${q.answer}' oninput='markAnswered(${i+1})' />`;
} else if(q.type === 'dogruyanlis') {
html += `<select data-answer='${q.answer}' onchange='markAnswered(${i+1})'>
<option value=''>Seçiniz</option>
<option value='doğru'>Doğru</option>
<option value='yanlış'>Yanlış</option>
</select>`;
} else if(q.type === 'test') {
q.options.forEach(opt => {
html += `<label><input type='radio' name='q${i+1}' value='${opt}' onclick='markAnswered(${i+1})' ${opt === q.answer ? "data-correct=''" : ""}/> ${opt}</label><br/>`;
});
}
html += `<br><button class='skip-btn' onclick='skipQuestion()'>Soruyu Geç</button>`;
html += `</div>`;
document.getElementById("questions").innerHTML += html;
});
}

function showQuestion(num) {
document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
let q = document.getElementById('q' + num);
if (q) q.classList.add('active');
currentQuestion = num;
}

function skipQuestion() {
let next = currentQuestion + 1;
if (next <= totalQuestions) {
showQuestion(next);
}
}

function createNavigation() {
let nav = document.getElementById('navigation');
for (let i = 1; i <= totalQuestions; i++) {
let btn = document.createElement('button');
btn.innerText = i;
btn.id = 'btn' + i;
btn.onclick = () => showQuestion(i);
nav.appendChild(btn);
}
}

function markAnswered(num) {
let btn = document.getElementById('btn' + num);
if (btn) btn.classList.add('answered');
}

function updateTimer() {
let minutes = Math.floor(timer / 60);
let seconds = timer % 60;
document.getElementById('timer').innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
if (timer === 0) {
calculateResult();
} else {
timer--;
setTimeout(updateTimer, 1000);
}
}

function calculateResult() {
let correct = 0;
document.querySelectorAll('.question').forEach((q, index) => {
let input = q.querySelector('input[type="text"], select, input[type="radio"]:checked');
if (input) {
let answer = input.getAttribute('data-answer') || input.dataset.correct !== undefined;
if (input.value == answer || input.getAttribute('data-correct') !== null) {
correct++;
}
}
});
let score = Math.round((correct / totalQuestions) * 100);
localStorage.setItem('puan', score);
window.location.href = 'sonuc.html';
}

function previewAnswers() {
window.open('onizleme.html', '_blank');
}

</script>
</body>
</html>
