<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eğitim Değerlendirme Anketi</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .form-container {
      background: #fff;
      max-width: 570px;
      margin: 60px auto 30px auto;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 28px;
    }
    .soru {
      margin-bottom: 24px;
    }
    .soru label {
      font-weight: bold;
      color: #2c3e50;
      display: block;
      margin-bottom: 10px;
    }
    .soru .options {
      margin-left: 10px;
      margin-bottom: 8px;
    }
    .soru .options label {
      font-weight: normal;
      margin-right: 18px;
      color: #2c3e50;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 7px;
      border: 1px solid #bbb;
      min-height: 65px;
      margin-top: 6px;
      resize: vertical;
    }
    .btn {
      background-color: #2c3e50;
      color: white;
      padding: 10px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      font-size: 15px;
      transition: background-color 0.3s;
      cursor: pointer;
      margin-top: 18px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .btn:hover {
      background-color: #18bc9c;
    }
    .result {
      text-align: center;
      margin-top: 28px;
      font-size: 17px;
      font-weight: bold;
      color: #2c3e50;
    }
    .footer-btn {
      width: 100%;
      text-align: center;
      margin-top: 35px;
      margin-bottom: 22px;
    }
    @media (max-width: 700px) {
      .form-container {
        max-width: 97vw;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>📝 Eğitim Değerlendirme Anketi</h2>
    <form id="degerlendirmeForm">
      <div class="soru">
        <label>1) Eğitimden genel olarak memnun kaldınız mı?</label>
        <div class="options">
          <label><input type="radio" name="memnuniyet" value="Evet"> Evet</label>
          <label><input type="radio" name="memnuniyet" value="Kısmen"> Kısmen</label>
          <label><input type="radio" name="memnuniyet" value="Hayır"> Hayır</label>
        </div>
      </div>
      <div class="soru">
        <label>2) Konu başlıkları ve içerik birbiriyle uyumlu muydu?</label>
        <div class="options">
          <label><input type="radio" name="uyum" value="Evet"> Evet</label>
          <label><input type="radio" name="uyum" value="Kısmen"> Kısmen</label>
          <label><input type="radio" name="uyum" value="Hayır"> Hayır</label>
        </div>
      </div>
      <div class="soru">
        <label>3) Verilen ödevler, kazanımları kavramanıza yardımcı oldu mu?</label>
        <div class="options">
          <label><input type="radio" name="odev" value="Evet"> Evet</label>
          <label><input type="radio" name="odev" value="Kısmen"> Kısmen</label>
          <label><input type="radio" name="odev" value="Hayır"> Hayır</label>
        </div>
      </div>
      <div class="soru">
        <label>4) Derslerin işleniş şekli anlaşılır mıydı?</label>
        <div class="options">
          <label><input type="radio" name="islenis" value="Evet"> Evet</label>
          <label><input type="radio" name="islenis" value="Kısmen"> Kısmen</label>
          <label><input type="radio" name="islenis" value="Hayır"> Hayır</label>
        </div>
      </div>
      <div class="soru">
        <label>5) Katılım ve etkileşim açısından yeterli buldunuz mu?</label>
        <div class="options">
          <label><input type="radio" name="katilim" value="Evet"> Evet</label>
          <label><input type="radio" name="katilim" value="Kısmen"> Kısmen</label>
          <label><input type="radio" name="katilim" value="Hayır"> Hayır</label>
        </div>
      </div>
      <div class="soru">
        <label>6) Eksik bulduğunuz ya da geliştirilmesi gereken bir konu var mı?</label>
        <textarea name="eksik" id="eksik" placeholder="Buraya yazabilirsiniz..."></textarea>
      </div>
      <div class="soru">
        <label>7) Genel görüş ve önerileriniz:</label>
        <textarea name="yorum" id="yorum" placeholder="Eklemek istediğiniz başka bir yorum..."></textarea>
      </div>
      <button type="button" class="btn" onclick="submitSurvey()">Gönder</button>
    </form>
    <div class="result" id="surveyResult"></div>
    <div class="footer-btn">
      <a href="anasayfa.html" class="btn">Anasayfaya Dön</a>
    </div>
  </div>
  <script>
    function submitSurvey() {
      const memnuniyet = document.querySelector('input[name="memnuniyet"]:checked');
      const uyum = document.querySelector('input[name="uyum"]:checked');
      const odev = document.querySelector('input[name="odev"]:checked');
      const islenis = document.querySelector('input[name="islenis"]:checked');
      const katilim = document.querySelector('input[name="katilim"]:checked');
      const eksik = document.getElementById("eksik").value.trim();
      const yorum = document.getElementById("yorum").value.trim();

      if (!memnuniyet || !uyum || !odev || !islenis || !katilim) {
        document.getElementById('surveyResult').innerText = "Lütfen tüm soruları işaretleyin.";
        return;
      }
      document.getElementById('degerlendirmeForm').style.display = 'none';
      document.getElementById('surveyResult').innerHTML = `
        <div>Yanıtlarınız alınmıştır. Teşekkürler!</div><br>
        <b>Memnuniyet:</b> ${memnuniyet.value}<br>
        <b>İçerik Uyum:</b> ${uyum.value}<br>
        <b>Ödev-Kazanım:</b> ${odev.value}<br>
        <b>Ders İşlenişi:</b> ${islenis.value}<br>
        <b>Katılım:</b> ${katilim.value}<br>
        <b>Eksik/Geliştirilecek:</b> ${eksik ? eksik : "-"}<br>
        <b>Genel Yorum:</b> ${yorum ? yorum : "-"}
      `;
    }
  </script>
</body>
</html>
