<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eğitim ve Site Değerlendirme Anketi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      max-width: 600px;
      margin: 60px auto 30px auto;
      padding: 30px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    label {
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 8px;
      display: block;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      resize: vertical;
      margin-top: 6px;
    }
    .btn {
      display: inline-block;
      margin-top: 18px;
      background-color: #2c3e50;
      color: white;
      padding: 10px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      font-size: 15px;
      transition: background-color 0.3s ease;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #18bc9c;
    }
    #feedbackResult {
      margin-top: 20px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
    }
    .footer-btn {
      width: 100%;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }
    @media (max-width: 700px) {
      .main-content {
        max-width: 97vw;
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="main-content">
    <h2>📝 Eğitim ve Site Değerlendirme Anketi</h2>
    <form id="feedbackForm">
      <div style="margin-bottom: 20px;">
        <label for="memnuniyet">1) Siteden genel olarak memnun musunuz?</label>
        <textarea id="memnuniyet" name="memnuniyet" rows="3" placeholder="Görüşünüzü yazın..."></textarea>
      </div>
      <div style="margin-bottom: 20px;">
        <label for="degisim">2) Eğitimde neyi değiştirmek isterdiniz?</label>
        <textarea id="degisim" name="degisim" rows="3" placeholder="Görüşünüzü yazın..."></textarea>
      </div>
      <div style="margin-bottom: 20px;">
        <label for="eniyi">3) Sence sitenin en iyi/hoşuna giden yönü ne?</label>
        <textarea id="eniyi" name="eniyi" rows="3" placeholder="Görüşünüzü yazın..."></textarea>
      </div>
      <div style="margin-bottom: 20px;">
        <label for="eksik">4) Eksik bulduğun veya eklenmesini istediğin bir şey var mı?</label>
        <textarea id="eksik" name="eksik" rows="3" placeholder="Görüşünüzü yazın..."></textarea>
      </div>
      <button type="button" class="btn" onclick="submitFeedback()">Gönder</button>
    </form>
    <div id="feedbackResult"></div>
    <div class="footer-btn">
      <a href="anasayfa.html" class="btn">Anasayfaya Dön</a>
    </div>
  </div>
  <script>
    function submitFeedback() {
      const memnuniyet = document.getElementById('memnuniyet').value.trim();
      const degisim = document.getElementById('degisim').value.trim();
      const eniyi = document.getElementById('eniyi').value.trim();
      const eksik = document.getElementById('eksik').value.trim();
      if (!memnuniyet && !degisim && !eniyi && !eksik) {
        document.getElementById('feedbackResult').innerText = "Lütfen en az bir soruya cevap yazın.";
        return;
      }
      document.getElementById('feedbackForm').style.display = 'none';
      document.getElementById('feedbackResult').innerHTML = `
        Yanıtlarınız alındı, teşekkürler!<br><br>
        <strong>Yanıtlarınız:</strong><br>
        <ul style="text-align:left">
          <li><b>1)</b> ${memnuniyet || "-"} </li>
          <li><b>2)</b> ${degisim || "-"} </li>
          <li><b>3)</b> ${eniyi || "-"} </li>
          <li><b>4)</b> ${eksik || "-"} </li>
        </ul>
      `;
    }
  </script>
</body>
</html>
