<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ödev 3 - Osmanlı'nın Kuruluşu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      display: flex;
    }
    .sidebar {
      width: 220px;
      background-color: #0073aa;
      color: white;
      padding: 20px;
      height: 100vh;
      position: fixed;
    }
    .sidebar h2 { text-align: center; margin-bottom: 30px; }
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .sidebar a:hover { background-color: #34495e; }
    .main-content {
      margin-left: 240px;
      padding: 30px;
      width: 100%;
      text-align: center;
    }
    .container {
      max-width: 800px;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin: auto;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    iframe {
      max-width: 100%;
      border: none;
      margin-bottom: 30px;
      border-radius: 10px;
    }
    button {
      background-color: #0073aa;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #005a87;
    }
    #message {
      font-size: 20px;
      font-weight: bold;
      color: green;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    #homeBtn {
      display: none;
      background-color: #28a745;
    }
    #homeBtn:hover {
      background-color: #1e7e34;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Ödevler</h2>
    <a href="odev.html">Ödev 1</a>
    <a href="odev2.html">Ödev 2</a>
    <a href="odev3.html" style="background-color: #34495e;">Ödev 3</a>
  </div>

  <div class="main-content">
    <div class="container">
      <h1>Ödev 3: Osmanlı'nın Kuruluşu</h1>

      <iframe
        style="max-width:100%"
        src="https://wordwall.net/tr/embed/34702300206943dc912a9f219155a09f?themeId=1&templateId=3&fontStackId=0"
        width="500"
        height="380"
        frameborder="0"
        allowfullscreen
      ></iframe>

      <button id="submitBtn">Ödevi Gönder</button>

      <div id="message"></div>
      <button id="homeBtn" onclick="goHome()">Anasayfaya Dön</button>
    </div>
  </div>

  <script>
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const homeBtn = document.getElementById('homeBtn');

    submitBtn.addEventListener('click', () => {
      message.textContent = "🎉 Tebrikler! Bütün ödevleri başarıyla tamamladınız.";
      submitBtn.style.display = 'none';
      homeBtn.style.display = 'inline-block';
    });

    function goHome() {
      window.location.href = 'anasayfa.html';
    }
  </script>
</body>
</html>
