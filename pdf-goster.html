<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Osmanlı'nın Fetih Siyaseti</title>
  <style>
    body {
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pdf-container {
      margin: 40px auto 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      width: 90vw;
      max-width: 800px;
    }
    h2 {
      color: #2c3e50;
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 80vh;
      border: none;
      border-radius: 8px;
    }
    .btn {
      display: block;
      width: 180px;
      margin: 20px auto 0 auto;
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #18bc9c;
    }
  </style>
</head>
<body>
  <div class="pdf-container">
    <h2>Osmanlı'nın Fetih Siyaseti</h2>
    <iframe src="avatarlar/konuanlatımı.pdf"></iframe>
    <a class="btn" href="javascript:window.close();">Kapat</a>
  </div>
</body>
</html>
