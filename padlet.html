<!DOCTYPE html>
<html lang="tr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Tanışma Haritası</title>
 <style>
   body {
     font-family: "Segoe UI", sans-serif;
     background: #f2f2f2;
     margin: 0;
     padding: 40px 10px;
     display: flex;
     justify-content: center;
   }
   .padlet-container {
     background: #ffffff;
     border-radius: 16px;
     box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
     max-width: 960px;
     width: 100%;
     padding: 20px;
     box-sizing: border-box;
   }
   .padlet-header {
     margin-bottom: 16px;
     text-align: center;
   }
   .padlet-header h2 {
     font-size: 24px;
     color: #333;
     margin: 0;
   }
   .padlet-header p {
     font-size: 16px;
     color: #555;
     margin-top: 8px;
   }
   .padlet-embed-wrapper iframe {
     width: 100%;
     height: 600px;
     border: none;
     border-radius: 8px;
   }
   .padlet-footer {
     text-align: right;
     margin-top: 8px;
   }
   .padlet-footer img {
     width: 114px;
     height: 28px;
   }


   /* Buton Stili */
   .bottom-button {
     display: flex;
     justify-content: center;
     margin-top: 30px;
   }
   .bottom-button a {
     text-decoration: none;
     background-color: #007bff;
     color: white;
     padding: 12px 24px;
     border-radius: 8px;
     font-size: 16px;
     transition: background-color 0.3s ease;
   }
   .bottom-button a:hover {
     background-color: #0056b3;
   }
 </style>
</head>
<body>


 <div class="padlet-container">
   <div class="padlet-header">
     <h2>Tanışma Haritası</h2>
     <p>Harita üzerinde istediğiniz konumu (Örneğin; memleketim,evim, en sevdiğim tatil yeri vs.) işaretleyin ve konum ile ilgili kısa bir not paylaşın. 👋</p>
   </div>


   <div class="padlet-embed-wrapper">
     <iframe src="https://padlet.com/embed/fv39pzolk22fqkxx" allow="camera;microphone;geolocation;display-capture;clipboard-write"></iframe>
   </div>


   <div class="padlet-footer">
     <a href="https://padlet.com?ref=embed" target="_blank">
       <img src="https://padlet.net/embeds/made_with_padlet_2022.png" alt="Padlet ile yapıldı">
     </a>
   </div>


   <div class="bottom-button">
     <a href="tarih.html">Devam Et →</a>
   </div>
 </div>


</body>
</html>
