<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Osmanlı Quizi</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <div id="saat-tarih"></div>
  <div id="quiz-container">
    <h1>Osmanlı Quizi</h1>
    <div id="question-area"></div>
    <button id="next-btn">İleri</button>
    <div id="result"></div>
  </div>
  <script>
    const sorular = [
      { soru: "Osmanlı'nın kurucusu?", secenekler: ["Osman Gazi", "Orhan Gazi"], dogru: 0 }
    ];
    let index = 0;
    function soruGoster() {
      const s = sorular[index];
      const area = document.getElementById("question-area");
      area.innerHTML = `<h3>${s.soru}</h3>`;
      s.secenekler.forEach((secenek, i) => {
        area.innerHTML += `<label><input type="radio" name="answer" value="${i}"> ${secenek}</label><br>`;
      });
    }
    document.getElementById("next-btn").addEventListener("click", soruGoster);
    soruGoster();
  </script>
</body>
</html>
