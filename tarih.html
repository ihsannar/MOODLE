<!DOCTYPE html>
<html lang="tr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Tarih Dersi</title>
 <style>
   * { box-sizing: border-box; margin: 0; padding: 0; }
   body {
     font-family: 'Segoe UI', sans-serif;
     background-color: #f0f2f5;
     display: flex;
   }
   body.dark-mode {
     background-color: #181a1b;
     color: #f5f5f5;
   }
   .sidebar {
     width: 220px;
     background-color: #2c3e50;
     height: 100vh;
     padding: 20px;
     color: white;
     position: fixed;
     left: 0;
     top: 0;
     transition: transform 0.3s ease;
     z-index: 1000;
   }
   body.dark-mode .sidebar { background-color: #1c1f21; }
   .sidebar.closed { transform: translateX(-100%); }
   .sidebar h2 { margin-top: 60px; margin-bottom: 30px; font-size: 22px; text-align: center; color: #fff; }
   .sidebar a { display: block; color: white; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 5px; transition: background 0.3s; }
   .sidebar a:hover { background-color: #34495e; }
   .sidebar-avatar { text-align: center; margin-bottom: 20px; }
   .sidebar-avatar img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
   .toggle-btn {
     position: fixed;
     top: 20px;
     left: 20px;
     background-color: #2c3e50;
     color: white;
     padding: 10px 15px;
     border: none;
     border-radius: 5px;
     cursor: pointer;
     z-index: 1100;
   }
   .main-content {
     margin-left: 240px;
     padding: 50px 30px;
     flex: 1;
     display: flex;
     flex-direction: column;
     gap: 24px;
     min-height: 100vh;
   }
   .main-content.shifted { margin-left: 80px; }
   .topic-slot {
     background: #fff;
     border-radius: 10px;
     box-shadow: 0 2px 8px rgba(0,0,0,0.06);
     padding: 30px;
     font-size: 1.25rem;
     cursor: pointer;
     transition: background 0.2s, box-shadow 0.2s;
     text-align: center;
     font-weight: bold;
     text-decoration: none;
     color: #2c3e50;
   }
   .topic-slot:hover { background: #f0f2f5; box-shadow: 0 4px 16px rgba(0,0,0,0.09); }
   body.dark-mode .topic-slot { background: #222426; color: #f5f5f5; }
   body.dark-mode .topic-slot:hover { background: #181a1b; }

   /* Değerlendirme bölümü için yeni CSS */
   .evaluation-section {
     width: 100%;
     margin: 64px 0 0 0;
     padding: 42px 0 48px 0;
     background: #fff;
     display: flex;
     flex-direction: column;
     align-items: center;
     border-radius: 18px 18px 0 0;
     box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
   }
   body.dark-mode .evaluation-section {
     background: #202325;
     color: #f5f5f5;
     box-shadow: 0 -2px 14px rgba(0,0,0,0.18);
   }
   .evaluation-btn {
     display: inline-block;
     padding: 16px 46px;
     background: #28a745;
     color: #fff;
     border: none;
     border-radius: 9px;
     font-size: 1.2rem;
     font-weight: bold;
     text-decoration: none;
     box-shadow: 0 2px 8px rgba(0,0,0,0.09);
     transition: background 0.2s;
     cursor: pointer;
     margin-top: 16px;
   }
   .evaluation-btn:hover {
     background: #218838;
     color: #fff;
   }
 </style>
</head>
<body>

<button class="toggle-btn" onclick="toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">
  <div class="sidebar-avatar">
    <img id="sidebar-avatar" src="https://i.ibb.co/m8V8Ndk/resim-2025-05-20-204425134.png" alt="Avatar">
  </div>
  <h2>Öğrenci Paneli</h2>
  <a href="anasayfa.html">Ana Sayfa</a>
  <a href="odev.html">Ödevler ve Alıştırmalar</a>
  <a href="notlar.html">Notlar</a>
  <a href="duyurular.html">Duyurular</a>
  <a href="profil.html">Profil</a>
  <a href="forum.html">Forum</a>
  <a href="ayarlar.html">Ayarlar</a>
  <a href="index.html">Çıkış Yap</a>
</div>

<div class="main-content" id="mainContent">
  <a class="topic-slot" href="konu1.html">Osmanlı Devletinin Kuruluşuna Giden Süreç</a>
  <a class="topic-slot" href="konu2.html">Osman Gazi ve Osmanlı Beyliğinin Doğuşu</a>
  <a class="topic-slot" href="konu3.html">Konu 3</a>
  <a class="topic-slot" href="konu4.html">Konu 4</a>

  <!-- En alt, ortalanmış değerlendirme bölümü -->
  <section class="evaluation-section" style="margin-top:32px;">
    <div style="font-size:1.3rem; font-weight:600; margin-bottom:18px;">
      Dersle ilgili görüşlerini iletmek veya genel değerlendirme yapmak için:
    </div>
    <a href="degerlendirme.html" class="evaluation-btn">
      Değerlendirme Sayfasına Git
    </a>
  </section>
</div>

<script>
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    sidebar.classList.toggle('closed');
    main.classList.toggle('shifted');
  }
  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('darkMode') === 'enabled') {
      document.body.classList.add('dark-mode');
    }
    const savedAvatar = localStorage.getItem("avatar");
    if (savedAvatar) {
      const sidebarAvatar = document.getElementById("sidebar-avatar");
      if (sidebarAvatar) sidebarAvatar.src = savedAvatar;
    }
  });
</script>
</body>
</html>
