<!DOCTYPE html>
<html lang="tr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Soru - Cevap Forumu</title>
 <style>
   * { box-sizing: border-box; margin: 0; padding: 0; }
   body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; }
   .sidebar {
     width: 220px; background-color: #2c3e50; height: 100vh; padding: 20px; color: white;
     position: fixed; left: 0; top: 0; z-index: 1000; transition: transform 0.3s;
   }
   .sidebar.closed { transform: translateX(-100%); }
   .sidebar-avatar { text-align: center; margin-bottom: 20px; }
   .sidebar-avatar img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
   .sidebar h2 { margin-top: 60px; margin-bottom: 30px; font-size: 22px; text-align: center; color: #fff; }
   .sidebar a { display: block; color: white; text-decoration: none; padding: 12px; margin-bottom: 10px;
     border-radius: 5px; transition: background 0.3s; }
   .sidebar a:hover { background-color: #34495e; }
   .toggle-btn {
     position: fixed; top: 20px; left: 20px; background-color: #2c3e50; color: white;
     padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; z-index: 1100;
   }
   .main-content {
     margin-left: 240px; padding: 30px; flex: 1; transition: margin-left 0.3s;
   }
   .main-content.shifted {
     margin-left: 20px; /* Sidebar gizli iken içerik sola kayar */
   }
   section {
     margin: 30px 0; padding: 20px; background-color: white; border-radius: 10px;
     box-shadow: 0 0 10px rgba(0,0,0,0.1);
   }
   .main-content h2 { margin-bottom: 10px; color: #2c3e50 !important; }
   /* Forum */
   .forum-list { margin-top: 20px; }
   .forum-comment, .forum-reply {
     margin-bottom: 15px; padding: 15px; background: #f6f7f9; border-radius: 8px;
     border: 1px solid #ececec; position: relative;
   }
   .forum-comment { margin-left: 0; }
   .forum-reply { margin-left: 30px; background: #eef3fa; }
   .forum-author { font-weight: bold; color: #2c3e50; margin-bottom: 5px; font-size: 15px; }
   .forum-time { font-size: 12px; color: #777; margin-left: 5px; }
   .forum-content { margin-bottom: 10px; white-space: pre-wrap; }
   .forum-actions button {
     background: none; border: none; color: #0073aa; cursor: pointer; font-size: 13px;
     padding: 0 8px 0 0; margin-right: 8px;
   }
   .forum-actions button:hover { text-decoration: underline; }
   .reply-box { margin-top: 10px; margin-left: 30px; }
   textarea { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; resize: vertical; }
   input[type="submit"] {
     margin-top: 10px; display: block; background: #2c3e50; color: white; border: none;
     padding: 8px 18px; border-radius: 5px; cursor: pointer; font-size: 15px;
   }
   input[type="submit"]:hover { background: #18bc9c; }
 </style>
</head>
<body>
<!-- Menü Butonu -->
<button class="toggle-btn" onclick="toggleSidebar()">☰</button>
<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-avatar">
    <img id="sidebar-avatar" src="https://i.ibb.co/m8V8Ndk/resim-2025-05-20-204425134.png" alt="Avatar">
  </div>
  <h2>Öğrenci Paneli</h2>
  <a href="anasayfa.html">Ana Sayfa</a>
  <a href="odev.html">Ödevler ve Alıştırmalar</a>
  <a href="notlar.html">Notlar</a>
  <a href="duyurular.html">Duyurular</a>
  <a href="profil.html">Profil</a>
  <a href="forum.html">Forum</a>
  <a href="ayarlar.html">Ayarlar</a>
  <a href="index.html">Çıkış Yap</a>
</div>
<div class="main-content" id="mainContent">
  <section>
    <h2>❓ Soru - Cevap</h2>
    <label for="question">Sorunuzu buraya yazın:</label><br>
    <textarea id="question" rows="4" placeholder="Örneğin: Osmanlı Devleti'nin kuruluş yılı nedir?"></textarea>
    <input type="submit" value="Gönder" id="gonder-btn">
    <div class="forum-list" id="forum-list">
      <!-- Yorumlar ve cevaplar burada görünecek -->
    </div>
  </section>
</div>
<script>
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    sidebar.classList.toggle('closed');
    main.classList.toggle('shifted');
  }
  window.addEventListener('DOMContentLoaded', () => {
    const savedAvatar = localStorage.getItem("avatar");
    if (savedAvatar) {
      const sidebarAvatar = document.getElementById("sidebar-avatar");
      if (sidebarAvatar) sidebarAvatar.src = savedAvatar;
    }
    renderForum();
  });
  // Forum kodları
  let forumData = [
    {
      id: 1,
      author: "Ayşe",
      content: "Osmanlı Devleti'nin ilk başkenti neresiydi?",
      time: "2 saat önce",
      replies: [
        {
          id: 11,
          author: "Mehmet",
          content: "Bilecik'ti ama kısa süre sonra Bursa oldu.",
          time: "1 saat önce",
          replies: []
        }
      ]
    },
    {
      id: 2,
      author: "Zeynep",
      content: "Fatih Sultan Mehmet hangi yıl doğdu?",
      time: "1 saat önce",
      replies: []
    }
  ];
  function renderForum() {
    const list = document.getElementById('forum-list');
    list.innerHTML = '';
    forumData.forEach(comment => {
      list.appendChild(createCommentElement(comment));
    });
  }
  function createCommentElement(comment, isReply = false) {
    const wrapper = document.createElement('div');
    wrapper.className = isReply ? 'forum-reply' : 'forum-comment';
    wrapper.innerHTML = `
      <div class="forum-author">${comment.author} <span class="forum-time">${comment.time}</span></div>
      <div class="forum-content">${comment.content}</div>
      <div class="forum-actions">
        <button onclick="showReplyBox(${comment.id}, this)">Yanıtla</button>
      </div>
      <div class="reply-list"></div>
    `;
    wrapper.querySelector('.reply-list').id = 'reply-list-' + comment.id;
    if (comment.replies && comment.replies.length > 0) {
      comment.replies.forEach(reply => {
        wrapper.querySelector('.reply-list').appendChild(createCommentElement(reply, true));
      });
    }
    return wrapper;
  }
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('gonder-btn').addEventListener('click', function(e) {
      e.preventDefault();
      const value = document.getElementById('question').value.trim();
      if (!value) return;
      const newComment = {
        id: Date.now(),
        author: "Sen",
        content: value,
        time: "şimdi",
        replies: []
      };
      forumData.push(newComment);
      document.getElementById('question').value = '';
      renderForum();
    });
  });
  function showReplyBox(commentId, btn) {
    if (btn.parentElement.parentElement.querySelector('.reply-box')) return;
    const replyDiv = document.createElement('div');
    replyDiv.className = 'reply-box';
    replyDiv.innerHTML = `
      <textarea rows="2" placeholder="Yanıtınızı yazın..."></textarea>
      <button onclick="submitReply(${commentId}, this)">Gönder</button>
    `;
    btn.parentElement.parentElement.appendChild(replyDiv);
  }
  function submitReply(parentId, btn) {
    const textarea = btn.parentElement.querySelector('textarea');
    const value = textarea.value.trim();
    if (!value) return;
    function findAndPushReply(comments) {
      for (let c of comments) {
        if (c.id === parentId) {
          c.replies.push({
            id: Date.now(),
            author: "Sen",
            content: value,
            time: "şimdi",
            replies: []
          });
          return true;
        } else if (c.replies && c.replies.length > 0) {
          if (findAndPushReply(c.replies)) return true;
        }
      }
      return false;
    }
    findAndPushReply(forumData);
    renderForum();
  }
</script>
</body>
</html>
