<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Sınav Önizleme - Doğru Cevaplar</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f0f0f0;
padding: 30px;
max-width: 800px;
margin: auto;
}
h1 {
text-align: center;
margin-bottom: 20px;
}
.question {
background: white;
padding: 15px 20px;
margin-bottom: 15px;
border-radius: 8px;
box-shadow: 0 0 8px rgba(0,0,0,0.1);
}
.answer {
margin-top: 10px;
font-weight: bold;
color: #28a745;
}
a {
display: inline-block;
margin-top: 20px;
text-decoration: none;
background: #007BFF;
color: white;
padding: 10px 15px;
border-radius: 6px;
}
a:hover {
background: #0056b3;
}
</style>
</head>
<body>
<h1>Sınav Önizleme - Doğru Cevaplar</h1>
<div id="preview"></div>
<div style="text-align:center;">
<a href="anasayfa.html">Anasayfaya Dön</a>
</div>

<script>
fetch('sorular.json')
.then(res => res.json())
.then(questions => {
const previewDiv = document.getElementById('preview');
questions.forEach((q, i) => {
const div = document.createElement('div');
div.className = 'question';
div.innerHTML = `<div><b>${i+1}. ${q.question}</b></div>`;
let answerText = '';
if (q.type === 'boşluk') {
answerText = q.answer;
} else if (q.type === 'dogruyanlis') {
answerText = q.answer === 'doğru' ? 'Doğru' : 'Yanlış';
} else if (q.type === 'test') {
answerText = q.answer;
}
div.innerHTML += `<div class="answer">Doğru Cevap: ${answerText}</div>`;
previewDiv.appendChild(div);
});
});
</script>
</body>
</html>
